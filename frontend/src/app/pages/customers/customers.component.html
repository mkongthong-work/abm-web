<div class="page-header">
  <div class="page-title">ลูกค้า</div>
  <div class="page-meta">{{ customers.length }} ราย</div>
</div>

<div class="card">
  <h3>เพิ่มลูกค้าใหม่</h3>
  <form (ngSubmit)="submit()">
    <div class="grid">
      <label>ชื่อลูกค้า *<input [(ngModel)]="form.name" name="name" required /></label>
      <label>ที่อยู่<input [(ngModel)]="form.address" name="address" /></label>
      <label>เลขผู้เสียภาษี<input [(ngModel)]="form.tax_id" name="tax_id" /></label>
      <label>โทรศัพท์<input [(ngModel)]="form.phone" name="phone" /></label>
      <label>อีเมล<input [(ngModel)]="form.email" name="email" /></label>
    </div>
    <button type="submit">+ เพิ่มลูกค้า</button>
  </form>
</div>

<p class="error" *ngIf="error">{{ error }}</p>
<p *ngIf="loading">กำลังโหลด...</p>

<div class="table-card" *ngIf="!loading">
  <table>
    <thead>
      <tr><th>ชื่อลูกค้า</th><th>เลขผู้เสียภาษี</th><th>โทรศัพท์</th><th>อีเมล</th><th></th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of customers">
        <td style="font-weight:600">{{ c.name }}</td>
        <td class="mono">{{ c.tax_id || '-' }}</td>
        <td>{{ c.phone || '-' }}</td>
        <td>{{ c.email || '-' }}</td>
        <td style="display:flex;gap:4px">
          <button class="link link-primary" (click)="openEdit(c)">แก้ไข</button>
          <button class="link" (click)="requestDelete(c)">ลบ</button>
        </td>
      </tr>
      <tr *ngIf="customers.length === 0">
        <td colspan="5" style="text-align:center;color:#6b7878;padding:28px">ยังไม่มีลูกค้า — เพิ่มลูกค้ารายแรกด้านบน</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- popup แก้ไขข้อมูลลูกค้า -->
<div class="modal-overlay" *ngIf="editing" (click)="closeEdit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>แก้ไขข้อมูลลูกค้า</h3>
      <button type="button" class="modal-close" (click)="closeEdit()" aria-label="ปิด">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form (ngSubmit)="requestSaveEdit()">
      <div class="grid">
        <label>ชื่อลูกค้า *<input [(ngModel)]="editForm.name" name="edit_name" required /></label>
        <label>ที่อยู่<input [(ngModel)]="editForm.address" name="edit_address" /></label>
        <label>เลขผู้เสียภาษี<input [(ngModel)]="editForm.tax_id" name="edit_tax_id" /></label>
        <label>โทรศัพท์<input [(ngModel)]="editForm.phone" name="edit_phone" /></label>
        <label>อีเมล<input [(ngModel)]="editForm.email" name="edit_email" /></label>
      </div>
      <p class="error" *ngIf="editError">{{ editError }}</p>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" (click)="closeEdit()" [disabled]="saving">ยกเลิก</button>
        <button type="submit" [disabled]="saving || !editForm.name">{{ saving ? 'กำลังบันทึก...' : 'บันทึกการแก้ไข' }}</button>
      </div>
    </form>
  </div>
</div>

<!-- popup ยืนยัน (ใช้ร่วมกันทั้งบันทึกและลบ) -->
<div class="modal-overlay" *ngIf="confirm" (click)="cancelConfirm()">
  <div class="modal-card confirm-card" (click)="$event.stopPropagation()">
    <p class="confirm-message">{{ confirm.message }}</p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" (click)="cancelConfirm()">ยกเลิก</button>
      <button type="button" [class.btn-danger-solid]="confirm.danger" (click)="confirm.onConfirm()">{{ confirm.confirmLabel }}</button>
    </div>
  </div>
</div>
